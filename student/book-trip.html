<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز رحلة جديدة - UniRide</title>
    <link class="sheet" rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link class="sheet" rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link class="sheet" rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="book-trip.html">UniRide الطالب 🎓</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="book-trip.html">حجز رحلة</a>
                <a class="nav-link" href="student-chat.html">الدعم والشكاوى</a>
                <button class="btn btn-sm btn-danger ms-3" id="logoutBtn">تسجيل خروج</button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row g-4">
            <div class="col-lg-5">
                <!-- رسالة الترحيب باسم الطالب -->
                <div class="mb-3 text-start">
                    <h4 class="fw-bold text-dark">مرحباً، <span id="welcomeStudentName" class="text-primary">...</span>
                        👋</h4>
                </div>
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="fa-solid fa-bus me-1"></i> احجز رحلتك الجامعية
                    </div>
                    <div class="card-body">
                        <form id="bookingForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">اختر الوجهة (Destination)</label>
                                <select class="form-select" id="bookingDest" required>
                                    <option value="" selected disabled>جاري تحميل الوجهات المتاحة...</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">اختر الكابتن/السائق المفضل</label>
                                <select class="form-select" id="bookingDriver" required disabled>
                                    <option value="" selected disabled>يجب اختيار الوجهة أولاً لعرض السائقين...</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">نوع الرحلة</label>
                                <div class="d-flex gap-2 flex-wrap">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tripType" id="goOnly"
                                            value="ذهاب" checked>
                                        <label class="form-check-label" for="goOnly">ذهاب فقط</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tripType" id="returnOnly"
                                            value="عودة">
                                        <label class="form-check-label" for="returnOnly">عودة فقط</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tripType" id="roundTrip"
                                            value="ذهاب وعودة">
                                        <label class="form-check-label" for="roundTrip">ذهاب وعودة</label>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3 d-none" id="goTimeContainer">
                                <label class="form-label fw-semibold text-primary">موعد الذهاب (من الموقف
                                    للجامعة)</label>
                                <select class="form-select" id="bookingGoTime">
                                    <option value="" selected disabled>اختر ميعاد الذهاب</option>
                                </select>
                            </div>

                            <div class="mb-3 d-none" id="returnTimeContainer">
                                <label class="form-label fw-semibold text-warning">موعد العودة (من الجامعة
                                    للموقف)</label>
                                <select class="form-select" id="bookingReturnTime">
                                    <option value="" selected disabled>اختر ميعاد العودة</option>
                                </select>
                            </div>

                            <div class="card bg-light p-3 border-0 rounded-3 mb-3 text-center">
                                <span class="text-muted small">التكلفة الإجمالية للرحلة</span>
                                <h3 class="fw-bold text-success mb-0" id="livePrice">0 ج.م</h3>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="confirmBookingBtn"
                                disabled>
                                <i class="fa-solid fa-circle-check me-1"></i> تأكيد الحجز والرفع للقاعدة
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-secondary text-white fw-bold">
                        <i class="fa-solid fa-history me-1"></i> رحلاتك المحجوزة مسبقاً
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 text-center">
                            <thead class="table-light">
                                <tr>
                                    <th>الوجهة</th>
                                    <th>الكابتن</th>
                                    <th>النوع</th>
                                    <th>تفاصيل المواعيد</th>
                                    <th>السعر</th>
                                    <th>الحالة</th>
                                </tr>
                            </thead>
                            <tbody id="studentBookingsTable">
                                <tr>
                                    <td colspan="6" class="text-muted">لم تقم بحجز أي رحلات بعد.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/student.js"></script>
</body>

</html>
