<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز رحلة جديدة - UniRide</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="book-trip.html">UniRide الطالب 🎓</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="book-trip.html">حجز رحلة</a>
                <a class="nav-link" href="student-chat.html">الدعم والشكاوى</a>
                <button class="btn btn-sm btn-danger ms-3" id="logoutBtn">تسجيل خروج</button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="fa-solid fa-bus me-1"></i> احجز رحلتك الجامعية
                    </div>
                    <div class="card-body">
                        <form id="bookingForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">اختر الوجهة (Destination)</label>
                                <select class="form-select" id="bookingDest" required>
                                    <option value="" selected disabled>جاري تحميل الوجهات المتاحة...</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">نوع الرحلة</label>
                                <div class="d-flex gap-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tripType" id="oneWay" value="ذهاب" checked>
                                        <label class="form-check-input-label" for="oneWay">ذهاب فقط</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tripType" id="roundTrip" value="ذهاب وعودة">
                                        <label class="form-check-input-label" for="roundTrip">ذهاب وعودة</label>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">موعد التحرك المناسب</label>
                                <select class="form-select" id="bookingTime" required disabled>
                                    <option value="" selected disabled>اختر الوجهة أولاً</option>
                                </select>
                            </div>

                            <div class="card bg-light p-3 border-0 rounded-3 mb-3 text-center">
                                <span class="text-muted small">التكلفة الإجمالية للرحلة</span>
                                <h3 class="fw-bold text-success mb-0" id="livePrice">0 ج.م</h3>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="confirmBookingBtn" disabled>
                                <i class="fa-solid fa-circle-check me-1"></i> تأكيد الحجز والرفع للقاعدة
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-secondary text-white fw-bold">
                        <i class="fa-solid fa-history me-1"></i> رحلاتك المحجوزة مسبقاً
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 text-center">
                            <thead class="table-light">
                                <tr>
                                    <th>الوجهة</th>
                                    <th>النوع</th>
                                    <th>الموعد</th>
                                    <th>السعر</th>
                                    <th>الحالة</th>
                                </tr>
                            </thead>
                            <tbody id="studentBookingsTable">
                                <tr><td colspan="5" class="text-muted">لم تقم بحجز أي رحلات بعد.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from "../js/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, addDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const bookingDest = document.getElementById("bookingDest");
        const bookingTime = document.getElementById("bookingTime");
        const livePrice = document.getElementById("livePrice");
        const bookingForm = document.getElementById("bookingForm");
        const confirmBookingBtn = document.getElementById("confirmBookingBtn");
        const bookingsTable = document.getElementById("studentBookingsTable");
        const logoutBtn = document.getElementById("logoutBtn");

        let destinationsData = {}; // لحفظ تفاصيل الوجهات محلياً بعد جلبها
        let currentStudentUid = null;
        let selectedBasePrice = 0;

        // 1. التأكد من هوية الطالب وجلب حجوزاته
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "../auth/login.html"; // لو مش مسجل يرجعه بره
            } else {
                currentStudentUid = user.uid;
                loadDestinations();
                loadStudentBookings();
            }
        });

        // 2. جلب الوجهات من الفايرستور (التي يضيفها الأدمن)
        async function loadDestinations() {
            try {
                const querySnapshot = await getDocs(collection(db, "destinations"));
                bookingDest.innerHTML = '<option value="" selected disabled>اختر وجهتك التدريسية...</option>';
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    destinationsData[docSnap.id] = data; // تخزين البيانات

                    const option = document.createElement("option");
                    option.value = docSnap.id;
                    option.textContent = `${data.name} (${data.price} ج.م)`;
                    bookingDest.appendChild(option);
                });
            } catch (err) {
                console.error("Error loading destinations:", err);
            }
        }

        // 3. مستمع لتحديث المواعيد والسعر عند اختيار الوجهة
        bookingDest.addEventListener("change", (e) => {
            const destId = e.target.value;
            const dest = destinationsData[destId];

            if (dest) {
                selectedBasePrice = dest.price;
                calculatePrice();

                // تفكيك المواعيد المفصولة بفاصلة وعرضها في السليكت
                bookingTime.innerHTML = "";
                const timesArray = dest.times.split("،");
                timesArray.forEach(time => {
                    const opt = document.createElement("option");
                    opt.value = time.trim();
                    opt.textContent = time.trim();
                    bookingTime.appendChild(opt);
                });

                bookingTime.disabled = false;
                confirmBookingBtn.disabled = false;
            }
        });

        // مراقبة تغيير نوع الرحلة (ذهاب / ذهاب وعودة) لتحديث السعر
        document.querySelectorAll('input[name="tripType"]').forEach(radio => {
            radio.addEventListener("change", calculatePrice);
        });

        function calculatePrice() {
            const isRoundTrip = document.getElementById("roundTrip").checked;
            const finalPrice = isRoundTrip ? selectedBasePrice * 2 : selectedBasePrice;
            livePrice.textContent = finalPrice + " ج.م";
        }

        // 4. معالجة فورم الحجز ورفعه للـ Firestore
        if (bookingForm) {
            bookingForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const destId = bookingDest.value;
                const destinationName = destinationsData[destId].name;
                const tripType = document.querySelector('input[name="tripType"]:checked').value;
                const selectedTime = bookingTime.value;
                const isRoundTrip = document.getElementById("roundTrip").checked;
                const totalCost = isRoundTrip ? selectedBasePrice * 2 : selectedBasePrice;

                try {
                    // إضافة الحجز في كوليكشن bookings الموحد
                    await addDoc(collection(db, "bookings"), {
                        studentUid: currentStudentUid,
                        destination: destinationName,
                        tripType: tripType,
                        time: selectedTime,
                        totalCost: totalCost,
                        status: "نشط", // حالة الرحلة
                        createdAt: serverTimestamp()
                    });

                    alert("تم حجز الرحلة بنجاح وهي تظهر الآن في إحصائيات الأدمن!");
                    bookingForm.reset();
                    livePrice.textContent = "0 ج.م";
                    bookingTime.disabled = true;
                    confirmBookingBtn.disabled = true;
                    loadStudentBookings(); // تحديث الجدول تلقائياً

                } catch (err) {
                    alert("فشل الحجز: " + err.message);
                }
            });
        }

        // 5. جلب وعرض رحلات الطالب الحالي فقط
        async function loadStudentBookings() {
            if (!bookingsTable) return;
            try {
                const q = query(collection(db, "bookings"), where("studentUid", "==", currentStudentUid));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    bookingsTable.innerHTML = `<tr><td colspan="5" class="text-muted">لم تقم بحجز أي رحلات بعد.</td></tr>`;
                    return;
                }

                bookingsTable.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td class="fw-bold">${data.destination}</td>
                        <td><span class="badge bg-light text-dark">${data.tripType}</span></td>
                        <td>${data.time}</td>
                        <td class="text-success fw-bold">${data.totalCost} ج.م</td>
                        <td><span class="badge bg-success">${data.status || 'نشط'}</span></td>
                    `;
                    bookingsTable.appendChild(tr);
                });
            } catch (err) {
                console.error("Error loading bookings:", err);
            }
        }

        // تسجيل الخروج
        if (logoutBtn) {
            logoutBtn.addEventListener("click", () => {
                signOut(auth).then(() => window.location.href = "../auth/login.html");
            });
        }
    </script>
</body>
</html>
