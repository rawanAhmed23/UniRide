<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة السائقين - لوحة الأدمن UniRide</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">UniRide Admin 🛠️</a>
            <div class="navbar-nav">
                <a class="nav-link" href="dashboard.html">الإحصائيات</a>
                <a class="nav-link active" href="manage-drivers.html">إدارة السائقين</a>
                <a class="nav-link" href="admin-approvals.html">طلبات التسجيل</a>
                <a class="nav-link" href="destinations.html">الوجهات والأسعار</a>
                <a class="nav-link" href="admin-chat.html">الشكاوى والمقترحات</a>
                <div class="navbar-nav me-auto">
                    <button id="logoutBtn" class="nav-link btn btn-link text-danger">
                        <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <h2 class="fw-bold mb-4">👥 إدارة السائقين بالشركة</h2>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-primary text-white fw-bold" id="formTitle">إضافة سائق جديد</div>
            <div class="card-body">
                <form id="driverForm">
                    <input type="hidden" id="driverId">

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">اسم السائق بالكامل</label>
                            <input type="text" class="form-control" id="driverName" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">الرقم القومي</label>
                            <input type="text" class="form-control" id="driverNationalId" required maxlength="14">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">البريد الإلكتروني (لإنشاء الحساب)</label>
                            <input type="email" class="form-control" id="driverEmail" required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">نوع السيارة</label>
                            <select class="form-select" id="carType" required>
                                <option value="ملاكي">ملاكي</option>
                                <option value="تربو">تربو</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">موديل السنة</label>
                            <input type="number" class="form-control" id="carModel" placeholder="مثال: 2024" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">رقم اللوحة</label>
                            <input type="text" class="form-control" id="plateNumber" placeholder="أ ص ج 123" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">عدد الركاب المتاح</label>
                            <input type="number" class="form-control" id="maxPassengers" required>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">تاريخ انتهاء رخصة القيادة</label>
                            <input type="date" class="form-control" id="driverLicenseExpiry" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">تاريخ انتهاء رخصة السيارة</label>
                            <input type="date" class="form-control" id="carLicenseExpiry" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">المرتب الثابت المقترح</label>
                            <input type="number" class="form-control" id="baseSalary" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">خط السير المعين (الوجهة)</label>
                            <select class="form-select" id="assignedDestination" required>
                                <option value="" selected disabled>اختر الوجهة الثابتة...</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-success w-100" id="submitBtn">حفظ البيانات وإنشاء الحساب</button>
                            <button type="button" class="btn btn-secondary w-100 d-none ms-2" id="cancelEditBtn">إلغاء التعديل</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white fw-bold">قائمة السائقين الحاليين</div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 text-center">
                    <thead class="table-light">
                        <tr>
                            <th>الاسم</th>
                            <th>نوع السيارة</th>
                            <th>رقم اللوحة</th>
                            <th>الوجهة الحالية</th>
                            <th>عدد الرحلات المنتهية</th> <th>المرتب الثابت</th>
                            <th>انتهاء رخصة السائق</th>
                            <th>العمليات</th>
                        </tr>
                    </thead>
                    <tbody id="driversTableBody">
                    </tbody>
                </table>
            </div>
            
            <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3 border-top">
                <span class="text-muted small" id="paginationInfo">جاري تحميل معلومات العرض...</span>
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0" id="paginationContainer">
                        </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="../js/admin.js"></script>
</body>

</html>
