<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الرئيسية - UniRide</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">UniRide Admin 🛠️</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="dashboard.html">الإحصائيات</a>
                <a class="nav-link" href="manage-drivers.html">إدارة السائقين</a>
                <a class="nav-link" href="destinations.html">الوجهات والأسعار</a>
                <a class="nav-link" href="admin-chat.html">الشكاوى والمقترحات</a>
                <div class="navbar-nav me-auto">
                    <button id="logoutBtn" class="nav-link btn btn-link text-danger">
                        <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
                    </button>
                </div>

            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <h2 class="fw-bold mb-4">📊 الإحصائيات والتقارير المالية الإجمالية</h2>

        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-3 bg-primary text-white p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-white-50">إجمالي الرحلات المحجوزة</h6>
                            <h2 class="fw-bold mb-0" id="totalTrips">0</h2>
                        </div>
                        <div class="fs-1 opacity-50"><i class="fa-solid fa-route"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-3 bg-success text-white p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-white-50">إجمالي عائد الرحلات (الإيرادات)</h6>
                            <h2 class="fw-bold mb-0" id="totalRevenue">0 ج.م</h2>
                        </div>
                        <div class="fs-1 opacity-50"><i class="fa-solid fa-money-bill-wave"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-3 bg-warning text-dark p-3">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-muted">إجمالي رواتب السائقين الملتزمين</h6>
                            <h2 class="fw-bold mb-0" id="totalDriversSalary">0 ج.م</h2>
                        </div>
                        <div class="fs-1 opacity-50"><i class="fa-solid fa-wallet"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-4 rounded-3 bg-white">
                    <h5 class="fw-bold text-dark mb-4"><i class="fa-solid fa-chart-bar text-primary me-2"></i>عدد الطلاب
                        لكل وجهة (الأكثر طلباً)</h5>
                    <div style="position: relative; height:300px;">
                        <canvas id="studentsChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-4 rounded-3 bg-white">
                    <h5 class="fw-bold text-dark mb-4"><i class="fa-solid fa-chart-pie text-success me-2"></i>توزيع
                        السائقين على الوجهات</h5>
                    <div style="position: relative; height:300px;">
                        <canvas id="driversChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module" src="../js/admin.js"></script>
</body>

</html>
