<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الشكاوى والدعم - UniRide Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .users-list {
            height: 450px;
            overflow-y: auto;
        }
        .chat-box {
            height: 390px;
            overflow-y: auto;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }
        .user-item {
            cursor: pointer;
            transition: background 0.2s;
        }
        .user-item:hover, .user-item.active {
            background-color: #e9ecef !important;
        }
        .msg {
            max-width: 75%;
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 15px;
        }
        .msg-student {
            background-color: #e9ecef;
            color: #212529;
            margin-left: auto; /* محاذاة لليمين عند الأدمن لأنها جاية من الطالب */
            border-bottom-right-radius: 2px;
        }
        .msg-admin {
            background-color: #0d6efd;
            color: white;
            margin-right: auto; /* محاذاة لليسار لأنها رسالة الأدمن الحالية */
            border-bottom-left-radius: 2px;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">UniRide Admin 🛠️</a>
            <div class="navbar-nav">
                <a class="nav-link" href="dashboard.html">الإحصائيات</a>
                <a class="nav-link" href="manage-drivers.html">إدارة السائقين</a>
                <a class="nav-link" href="admin-approvals.html">طلبات التسجيل</a>
                <a class="nav-link" href="destinations.html">الوجهات والأسعار</a>
                <a class="nav-link active" href="admin-chat.html">الشكاوى والمقترحات</a>
                <div class="navbar-nav me-auto">
                    <button id="logoutBtn" class="nav-link btn btn-link text-danger">
                        <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
                    </button>
                </div>

            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-secondary text-white fw-bold">
                        <i class="fa-solid fa-users me-2"></i>المحادثات النشطة
                    </div>
                    <div class="list-group list-group-flush users-list" id="usersListContainer">
                        <div class="text-center text-muted p-4" id="loadingUsers">
                            <i class="fa-solid fa-spinner fa-spin mb-2"></i> جاري تحميل قائمة الطلاب...
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8 mb-4">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-primary text-white fw-bold d-flex justify-content-between align-items-center">
                        <span><i class="fa-solid fa-comments me-2"></i>نافذة الرد الفوري</span>
                        <span class="badge bg-light text-dark small" id="activeChatTarget">اختر طالباً لبدء الرد</span>
                    </div>
                    
                    <div class="card-body chat-box d-flex flex-column p-3" id="adminChatContainer">
                        <div class="text-center text-muted my-auto" id="placeholderChat">
                            <i class="fa-solid fa-comment-dots fa-3x mb-3 text-secondary"></i>
                            <p>برجاء اختيار أحد الطلاب من القائمة الجانبية لعرض تفاصيل الشكوى والرد عليها حياً.</p>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-top-0 p-3">
                        <form id="adminChatForm" class="d-flex gap-2">
                            <input type="text" id="adminMessageInput" class="form-control" placeholder="اكتب رد الدعم الفني هنا..." required disabled>
                            <button type="submit" class="btn btn-dark px-4 fw-bold" id="adminSendBtn" disabled>
                                <i class="fa-solid fa-paper-plane"></i> رد
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from "../js/firebase-config.js";
        import { collection, addDoc, query, orderBy, onSnapshot, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const usersListContainer = document.getElementById("usersListContainer");
        const adminChatContainer = document.getElementById("adminChatContainer");
        const adminMessageInput = document.getElementById("adminMessageInput");
        const adminSendBtn = document.getElementById("adminSendBtn");
        const adminChatForm = document.getElementById("adminChatForm");
        const activeChatTarget = document.getElementById("activeChatTarget");

        let selectedStudentUid = null;
        let selectedStudentName = "";
        let unsubscribeCurrentChat = null; // لإغلاق المستمع القديم عند التنقل بين الطلاب

        // 1. الاستماع الحي لجميع الرسائل لتجميع الطلاب الفريدين في القائمة الجانبية
        function loadActiveChatsList() {
            const q = query(collection(db, "support_chats"), orderBy("createdAt", "desc"));

            onSnapshot(q, (snapshot) => {
                const loadingUsers = document.getElementById("loadingUsers");
                if (loadingUsers) loadingUsers.remove();

                usersListContainer.innerHTML = "";
                
                // استخدام الـ Map لمنع تكرار الطلاب وعرض آخر رسالة فقط لكل طالب
                const uniqueStudents = new Map();

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.studentUid && !uniqueStudents.has(data.studentUid)) {
                        uniqueStudents.set(data.studentUid, {
                            name: data.studentName || "طالب مجهول",
                            lastMessage: data.message,
                            uid: data.studentUid
                        });
                    }
                });

                if (uniqueStudents.size === 0) {
                    usersListContainer.innerHTML = `<div class="text-center text-muted p-4">لا توجد شكاوى أو محادثات حالياً.</div>`;
                    return;
                }

                uniqueStudents.forEach((student) => {
                    const button = document.createElement("button");
                    button.className = `list-group-item list-group-item-action user-item p-3 d-flex flex-column align-items-start ${selectedStudentUid === student.uid ? 'active' : ''}`;
                    button.innerHTML = `
                        <div class="d-flex w-100 justify-content-between">
                            <h6 class="mb-1 fw-bold text-dark">${student.name}</h6>
                        </div>
                        <p class="mb-1 small text-muted text-truncate w-100" style="max-width: 280px;">${student.lastMessage}</p>
                    `;
                    
                    button.addEventListener("click", () => selectStudentForChat(student.uid, student.name));
                    usersListContainer.appendChild(button);
                });
            });
        }

        // 2. تفعيل الشات المباشر مع طالب معين عند الضغط عليه
        function selectStudentForChat(studentUid, studentName) {
            selectedStudentUid = studentUid;
            selectedStudentName = studentName;
            activeChatTarget.textContent = `محادثة: ${studentName}`;
            
            // تفعيل حقل الكتابة والزرار للرد
            adminMessageInput.disabled = false;
            adminSendBtn.disabled = false;
            adminMessageInput.focus();

            // إعادة بناء القائمة الجانبية لتحديث الـ Active class
            document.querySelectorAll(".user-item").forEach(item => {
                if(item.querySelector("h6").textContent === studentName) item.classList.add("active");
                else item.classList.remove("active");
            });

            // لو فيه مستمع قديم شغال لشكاوى طالب آخر نقفله الأول عشان الأداء
            if (unsubscribeCurrentChat) unsubscribeCurrentChat();

            // الاستماع لرسائل هذا الطالب بالتحديد مرتبة تصاعدياً
            const chatQuery = query(
                collection(db, "support_chats"),
                where("studentUid", "==", studentUid),
                orderBy("createdAt", "asc")
            );

            unsubscribeCurrentChat = onSnapshot(chatQuery, (snapshot) => {
                adminChatContainer.innerHTML = "";

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const msgDiv = document.createElement("div");

                    if (data.sender === "student") {
                        msgDiv.className = "msg msg-student";
                        msgDiv.innerHTML = `<strong>${data.studentName}:</strong> <br> ${data.message}`;
                    } else {
                        msgDiv.className = "msg msg-admin";
                        msgDiv.textContent = data.message;
                    }

                    adminChatContainer.appendChild(msgDiv);
                });

                adminChatContainer.scrollTop = adminChatContainer.scrollHeight;
            });
        }

        // 3. معالجة إرسال رد الأدمن
        if (adminChatForm) {
            adminChatForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const replyText = adminMessageInput.value.trim();
                if (!replyText || !selectedStudentUid) return;

                try {
                    await addDoc(collection(db, "support_chats"), {
                        studentUid: selectedStudentUid,
                        studentName: selectedStudentName,
                        message: replyText,
                        sender: "admin", // الأدمن هو الراسل
                        createdAt: new Date()
                    });

                    adminMessageInput.value = "";
                } catch (err) {
                    alert("فشل إرسال الرد: " + err.message);
                }
            });
        }

        // تشغيل جلب قائمة الطلاب أول ما الصفحة تفتح تلقائياً
        loadActiveChatsList();
    </script>
</body>
</html>
