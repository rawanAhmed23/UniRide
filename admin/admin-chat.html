<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشكاوى والمقترحات - لوحة الأدمن UniRide</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">UniRide Admin 🛠️</a>
            <div class="navbar-nav">
                <a class="nav-link" href="dashboard.html">الإحصائيات</a>
                <a class="nav-link" href="manage-drivers.html">إدارة السائقين</a>
                <a class="nav-link" href="admin-approvals.html">طلبات التسجيل</a>
                <a class="nav-link" href="destinations.html">الوجهات والأسعار</a>
                <a class="nav-link active" href="admin-chat.html">الشكاوى والمقترحات</a>
                <div class="navbar-nav me-auto">
                    <button id="logoutBtn" class="nav-link btn btn-link text-danger">
                        <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
                    </button>
                </div>

            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <h2 class="fw-bold mb-4">💬 صندوق الشكاوى والمقترحات والدعم الفني</h2>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="fa-solid fa-list-check me-1"></i> الرسائل الواردة
                    </div>
                    <div class="list-group list-group-flush" id="ticketsList" style="max-height: 500px; overflow-y: auto;">
                        <div class="p-3 text-center text-muted">جاري تحميل الرسائل...</div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-3 d-flex flex-column" style="height: 550px;">
                    <div class="card-header bg-primary text-white fw-bold d-flex justify-content-between align-items-center">
                        <div>
                            <i class="fa-solid fa-comments me-1"></i> 
                            <span id="chatWithUsername">اختر مستخدماً لبدء المحادثة</span>
                        </div>
                        <span class="badge bg-light text-dark small" id="userRoleBadge" style="display:none;"></span>
                    </div>
                    
                    <div class="card-body bg-white p-3 d-flex flex-column" id="chatBox" style="overflow-y: auto; flex-grow: 1;">
                        <div class="text-center my-auto text-muted">
                            <i class="fa-solid fa-comment-slash fs-1 d-block mb-2"></i>
                            الرجاء تحديد محادثة من القائمة الجانبية لعرض التفاصيل والرد.
                        </div>
                    </div>

                    <div class="card-footer bg-light border-0 p-3">
                        <form id="replyForm" class="d-flex gap-2">
                            <input type="hidden" id="activeChatId">
                            <input type="text" class="form-control" id="replyMessage" placeholder="اكتب ردك هنا..." disabled required>
                            <button type="submit" class="btn btn-primary px-4 fw-bold" id="sendBtn" disabled>
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from "../js/firebase-config.js";
        import { collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const ticketsList = document.getElementById("ticketsList");
        const chatBox = document.getElementById("chatBox");
        const chatWithUsername = document.getElementById("chatWithUsername");
        const userRoleBadge = document.getElementById("userRoleBadge");
        const replyForm = document.getElementById("replyForm");
        const replyMessage = document.getElementById("replyMessage");
        const sendBtn = document.getElementById("sendBtn");
        const activeChatIdInput = document.getElementById("activeChatId");

        let unsubscribeMessages = null;

        // 1. جلب قائمة تذاكر الشات (المحادثات النشطة)
        function loadChatTickets() {
            const q = query(collection(db, "support_chats"), orderBy("lastMessageTime", "desc"));
            
            onSnapshot(q, (snapshot) => {
                ticketsList.innerHTML = "";
                if (snapshot.empty) {
                    ticketsList.innerHTML = "<div class='p-3 text-center text-muted'>لا توجد شكاوى أو رسائل حالياً.</div>";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const chat = docSnap.data();
                    const chatId = docSnap.id;
                    
                    const button = document.createElement("button");
                    button.className = "list-group-item list-group-item-action p-3 border-bottom text-start";
                    // تمييز المحادثات غير المقروءة من قبل الأدمن
                    if (chat.adminUnread) {
                        button.classList.add("bg-warning-subtle", "fw-bold");
                    }

                    button.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="text-dark">${chat.userName || "مستخدم مجهول"}</span>
                            <span class="badge bg-secondary px-2 py-1" style="font-size: 10px;">${chat.userRole || "طالب"}</span>
                        </div>
                        <p class="text-muted small text-truncate mb-0" style="max-width: 230px;">${chat.lastMessage || "لا توجد رسائل"}</p>
                    `;

                    button.addEventListener("click", () => openChat(chatId, chat));
                    ticketsList.appendChild(button);
                });
            }, (error) => {
                console.error("Error fetching chats: ", error);
            });
        }

        // 2. فتح محادثة معينة وعرض رسائلها
        function openChat(chatId, chatData) {
            // تفعيل حقول الإدخال
            replyMessage.disabled = false;
            sendBtn.disabled = false;
            activeChatIdInput.value = chatId;
            chatWithUsername.innerText = chatData.userName;
            userRoleBadge.innerText = chatData.userRole || "طالب";
            userRoleBadge.style.display = "inline-block";

            // إلغاء الاستماع للمحادثة السابقة إن وجد
            if (unsubscribeMessages) unsubscribeMessages();

            // تحديث حالة القراءة (مارك كـ مقروء للأدمن)
            if (chatData.adminUnread) {
                updateDoc(doc(db, "support_chats", chatId), { adminUnread: false });
            }

            // جلب الرسائل الخاصة بهذه المحادثة
            const messagesRef = collection(db, "support_chats", chatId, "messages");
            const q = query(messagesRef, orderBy("timestamp", "asc"));

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                chatBox.innerHTML = "";
                
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const isSenderAdmin = msg.sender === "admin";
                    
                    const msgWrapper = document.createElement("div");
                    msgWrapper.className = `d-flex mb-3 ${isSenderAdmin ? 'justify-content-start' : 'justify-content-end'}`;
                    
                    msgWrapper.innerHTML = `
                        <div class="card p-2 px-3 rounded-3 shadow-sm ${isSenderAdmin ? 'bg-primary text-white' : 'bg-light text-dark'}" style="max-width: 75%;">
                            <p class="mb-0 small">${msg.text}</p>
                        </div>
                    `;
                    chatBox.appendChild(msgWrapper);
                });
                
                // عمل سكرول تلقائي لأسفل الشات عند وصول رسالة جديدة
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        // 3. إرسال رد الأدمن
        if (replyForm) {
            replyForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const chatId = activeChatIdInput.value;
                const text = replyMessage.value.trim();

                if (!chatId || !text) return;

                try {
                    // إضافة الرسالة في الكوليكشن الفرعي (Sub-collection)
                    await addDoc(collection(db, "support_chats", chatId, "messages"), {
                        sender: "admin",
                        text: text,
                        timestamp: serverTimestamp()
                    });

                    // تحديث بيانات المحادثة الرئيسية (الأب)
                    await updateDoc(doc(db, "support_chats", chatId), {
                        lastMessage: text,
                        lastMessageTime: serverTimestamp(),
                        userUnread: true // تنبيه للمستخدم أن هناك رد من الأدمن
                    });

                    replyForm.reset();
                } catch (err) {
                    console.error("Error sending reply: ", err);
                    alert("فشل إرسال الرد: " + err.message);
                }
            });
        }

        // تشغيل جلب التذاكر فور فتح الصفحة
        loadChatTickets();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module" src="../js/admin.js"></script>
</body>
</html>
