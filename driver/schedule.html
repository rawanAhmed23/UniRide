<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول الرحلات والمواعيد - UniRide Driver</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* تحسينات المظهر */
        body { background-color: #f8f9fa; }
        .card { border-radius: 1rem !important; border: none !important; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075) !important; }
        .table th { background-color: #f8f9fa; color: #333; font-weight: 600; }
        .table td, .table th { padding: 1.2rem !important; vertical-align: middle; }
        #endTripBtn { border-radius: 0.5rem; transition: 0.3s; }
        .rounded-circle { transition: 0.3s; }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="profile.html">لوحة السائق 🚍</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="profile.html">الحساب الشخصي</a>
                    <a class="nav-link active" href="schedule.html">جدول الرحلات</a>
                    <a class="nav-link" href="driver-history.html">سجل الرحلات</a>
                    <a class="nav-link text-warning fw-bold" id="logoutBtn" href="#">تسجيل الخروج</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card text-center h-100 p-4">
                    <div class="rounded-circle bg-success bg-opacity-10 p-4 mb-3 mx-auto text-success" style="width: 80px; height: 80px;">
                        <i class="fa-solid fa-route fa-2x"></i>
                    </div>
                    <h5 class="text-muted fw-bold mb-2">خط السير المعين لك</h5>
                    <h3 class="text-dark fw-black mb-3" id="driverRoute">جاري التحميل...</h3>
                    <span class="badge bg-secondary px-3 py-2 fs-6" id="carInfo">جاري تحميل السيارة...</span>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card p-4 h-100">
                    <h4 class="fw-bold text-success mb-4"><i class="fa-solid fa-clipboard-list me-2"></i> تفاصيل رحلة اليوم</h4>

                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <div class="p-3 border rounded-3 bg-light text-center">
                                <h6 class="text-muted small">عدد الطلاب</h6>
                                <h2 class="text-primary fw-bold mb-0" id="bookedStudentsCount">0</h2>
                                <small class="text-muted" id="maxCapacity">-- كراسي</small>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="p-3 border rounded-3 bg-light text-center">
                                <h6 class="text-muted small">مواعيد التحرك</h6>
                                <p class="text-dark fw-bold mb-0" id="routeTimes">---</p>
                                <small class="text-success"><i class="fa-solid fa-clock"></i> ثابت</small>
                            </div>
                        </div>
                    </div>

                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-users text-secondary me-2"></i> قائمة الطلاب المشتركين</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle text-center mb-0">
                            <thead>
                                <tr>
                                    <th>اسم الطالب</th>
                                    <th>الموعد</th>
                                    <th>النوع</th>
                                    <th>العمليات</th>
                                </tr>
                            </thead>
                            <tbody id="studentsTableBody">
                                <tr>
                                    <td colspan="4" class="text-muted py-4">جاري سحب قوائم الطلاب...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="mt-4">
                        <button id="endTripBtn" class="btn btn-danger w-100 py-3 fw-bold shadow-sm">
                            <i class="fa-solid fa-flag-checkered me-2"></i> إنهاء الرحلة الحالية
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/driver.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
