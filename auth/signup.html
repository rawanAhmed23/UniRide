<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب طالب - UniRide</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">UniRide 🎓</h2>
                        <p class="text-muted">إنشاء حساب جديد (يتطلب موافقة الإدارة)</p>
                    </div>

                    <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
                    <div id="successMessage" class="alert alert-success d-none" role="alert"></div>

                    <form id="signupForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">الاسم بالكامل</label>
                            <input type="text" class="form-control" id="fullName" required>
                        </div>
                        <div class="mb-3">
                            <label for="nationalId" class="form-label">الرقم القومي</label>
                            <input type="text" class="form-control" id="nationalId" required maxlength="14" pattern="\d{14}">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">البريد الإلكتروني الجامعي / الشخصي</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">كلمة المرور</label>
                            <input type="password" class="form-control" id="password" required minlength="6">
                        </div>
                        
                        <div class="mb-4">
                            <label for="idCard" class="form-label text-danger fw-bold">صورة الكارنيه الجامعي (إجباري)</label>
                            <input type="file" class="form-control" id="idCard" accept="image/*" required>
                            <div class="form-text">سيتم مراجعة الكارنيه وتفعيل حسابك من قبل الإدارة.</div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2" id="submitBtn">
                            تسجيل ورفع الكارنيه
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="mb-0 text-muted">لديك حساب بالفعل؟ <a href="login.html" class="text-decoration-none">تسجيل الدخول</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/auth.js"></script>
</body>
</html>
