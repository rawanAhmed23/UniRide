<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - UniRide</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0 p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">UniRide 🚌</h2>
                        <p class="text-muted">مرحباً بك مجدداً، سجل دخولك للمتابعة</p>
                    </div>
                    
                    <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">كلمة المرور</label>
                            <input type="password" class="form-control" id="password" required placeholder="********">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">تسجيل الدخول</button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="mb-0 text-muted">طالب جديد؟ <a href="signup.html" class="text-decoration-none">أنشئ حسابك الآن</a></p>
                        <a href="../index.html" class="d-block mt-2 text-secondary text-decoration-none">← العودة للرئيسية</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/auth.js"></script>
</body>
</html>
